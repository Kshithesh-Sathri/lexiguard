<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LexiGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .header {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .logo { font-size: 16px; font-weight: 700; color: #818cf8; }
    .badge {
      font-size: 10px;
      background: #312e81;
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .body { padding: 14px; }
    .scan-btn {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .scan-btn:hover { background: #4338ca; }
    .loading { text-align: center; padding: 20px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #334155;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #94a3b8; font-size: 12px; }
    .score-box {
      text-align: center;
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 10px;
    }
    .score-num { font-size: 44px; font-weight: 800; line-height: 1; }
    .score-lbl { font-size: 11px; color: #64748b; margin: 3px 0; }
    .score-status { font-size: 12px; font-weight: 600; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .stat {
      background: #1e293b;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; }
    .stat-lbl { font-size: 10px; color: #64748b; }
    .concern {
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .open-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .open-btn:hover { opacity: 0.9; }
    .rescan-btn {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #818cf8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .rescan-btn:hover { background: #1e293b; }
    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #fca5a5;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .clauses-label {
      font-size: 10px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .clause {
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 6px;
      border-left: 3px solid;
      font-size: 11px;
    }
    .clause.High { background: rgba(239,68,68,0.08); border-color: #ef4444; }
    .clause.Medium { background: rgba(245,158,11,0.08); border-color: #f59e0b; }
    .clause.Low { background: rgba(59,130,246,0.08); border-color: #3b82f6; }
    .clause-type {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .clause.High .clause-type { color: #ef4444; }
    .clause.Medium .clause-type { color: #f59e0b; }
    .clause.Low .clause-type { color: #3b82f6; }
    .clause-text { color: #cbd5e1; line-height: 1.4; }
    .scroll { max-height: 220px; overflow-y: auto; }
    .scroll::-webkit-scrollbar { width: 3px; }
    .scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">LexiGuard</span>
    <span class="badge">AI Scanner</span>
  </div>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
